# Publishes the site to GitHub Pages.
#
# `npm run build` renders every page to static HTML in `dist/` — there is no
# server and no client bundle behind the published site, so the artifact below is
# byte-for-byte what a visitor receives.
#
# The base path is read from GitHub instead of being hardcoded here:
# `configure-pages` reports where Pages actually mounts the repository, and the
# build stamps it into every asset URL through `SITE_BASE`. That keeps
# `vite.config.ts` the only place a default base is written down, and means a
# move to a user site or a custom domain needs no change to this file.
#
# One-time setup, because a workflow cannot change it: Settings → Pages → Build
# and deployment → Source must be "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  # Publish on merge to main.
  push:
    branches: [main]
  # Run the same gates on pull requests without publishing, so main cannot
  # inherit a build that 404s or fails the contrast audit.
  pull_request:
  # Redeploy main by hand (re-running a deploy needs no code change).
  workflow_dispatch:

# Serialise deploys: two concurrent Pages runs in one repository interfere.
# Not cancelling means a published deploy is never abandoned half-way.
concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages mints an OIDC token to read the Pages configuration.
      id-token: write
      pages: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          # Matches the version the build is verified against locally.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check and audit colour contrast
        run: npm run check

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}

      # The build already refuses to emit a page whose in-page anchors do not
      # resolve, and it now refuses one whose root-relative URLs lead nowhere.
      # What only this step can say is what a *correct* deployment looks like:
      # these are the eight files the published site needs. robots.txt and
      # sitemap.xml are listed here even though `npm run build` already refuses
      # to write a sitemap that points at nothing — this list is what the
      # artifact upload would silently truncate if publicDir handling changed.
      #
      # The stylesheet URL is read back out of the artifact instead of being
      # re-derived from the Pages base path. Grepping for the interpolated
      # `${SITE_BASE}assets/site.css` was self-fulfilling: with `base_path=/cv`
      # it matched the glued `/cvassets/site.css`, so the deploy that shipped an
      # unstyled site passed green. Only a check that never consults that value
      # can disagree with it, so the URL is now judged on its own shape.
      - name: Verify artifact
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          test -f dist/index.html
          test -f dist/es/index.html
          test -f dist/404.html
          test -f dist/assets/site.css
          test -f dist/.nojekyll
          test -f dist/og-image.png
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          href=$(sed -n 's|.*<link rel="stylesheet" href="\([^"]*\)".*|\1|p' dist/index.html | head -n 1)
          if [ -z "$href" ]; then
            echo '::error::dist/index.html links no stylesheet'
            exit 1
          fi
          # A URL whose base lost its trailing slash has no separate /assets/
          # segment, so this rejects /cvassets/site.css while still accepting
          # /assets/site.css on a deployment mounted at the root.
          case "$href" in
            */assets/site.css) ;;
            *) echo "::error::$href is not mounted under a deployment base"; exit 1 ;;
          esac
          # `dist/` is published *at* the base, so the base is a URL prefix and
          # not a directory: /cv/assets/site.css is dist/assets/site.css.
          mount=${SITE_BASE%/}
          if [ ! -f "dist${href#"$mount"}" ]; then
            echo "::error::dist${href#"$mount"} does not exist, so $href would 404 on Pages"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    # main only. This also skips pull_request, whose ref is refs/pull/…/merge,
    # and a workflow_dispatch started from a feature branch — neither should be
    # able to publish.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Everything above proves the artifact is self-consistent. It cannot say
      # Pages served it, and this repository's one production incident was
      # precisely that gap: a correct `dist/` published under URLs that led
      # nowhere, with every green check in agreement. This step is the only one
      # that asks the live site.
      #
      # It therefore reads `page_url` and the published HTML, and never
      # `SITE_BASE`: deriving an expectation from the value under test is what
      # let the unstyled deploy pass, because the old gate matched the glued
      # `/cvassets/site.css` it was supposed to reject.
      - name: Smoke-check the published site
        run: |
          root='${{ steps.deployment.outputs.page_url }}'
          case "$root" in
            https://*) ;;
            *) echo "::error::deploy-pages reported no https page_url (got: $root)"; exit 1 ;;
          esac
          base=${root%/}
          # The stylesheet href in the page is a root-relative path, so it needs
          # scheme + host back, and nothing else: appending it to $base would
          # repeat the mount. Split on '://' first so the host boundary is the
          # first '/' after the scheme, not the first '/' in the URL.
          scheme=${root%%://*}
          host=${root#*://}
          host=${host%%/*}
          origin="$scheme://$host"
          body=$(mktemp)
          failed=0

          # No --location: a redirect means the deployment is not serving what
          # it claims at the address it claims, and following it would hide
          # exactly the mount mistake this step exists to catch.
          #
          # Retries carry a cache-busting query. Pages holds a URL for 600s, so
          # a first attempt can legitimately read the previous deploy.
          check() { # url expected_code [content_type_prefix]
            url=$1 want=$2 want_type=${3-}
            for attempt in 1 2 3 4 5 6; do
              [ "$attempt" -gt 1 ] && url="${url%%\?*}?cb=$GITHUB_RUN_ID-$attempt"
              got=$(curl -s -o "$body" --max-time 20 -w '%{http_code} %{content_type}' "$url") || true
              code=${got%% *}
              ctype=${got#* }
              if [ "$code" = "$want" ]; then
                case "$ctype" in
                  "$want_type"*) echo "  ok   $want  $url"; return 0 ;;
                esac
              fi
              [ "$attempt" = 6 ] || sleep 10
            done
            echo "::error::$url expected $want ${want_type:-any type} but answered '$got'"
            return 1
          }

          echo "Checking $base"
          check "$base/" 200 text/html || failed=$((failed + 1))

          # The stylesheet URL is read out of the page Pages actually served,
          # then requested on its own. A base that lost its trailing slash
          # produces /cvassets/site.css, which has no /assets/ segment.
          href=$(sed -n 's|.*<link rel="stylesheet" href="\([^"]*\)".*|\1|p' "$body" | head -n 1)
          if [ -z "$href" ]; then
            echo '::error::the published page links no stylesheet'
            failed=$((failed + 1))
          else
            case "$href" in
              */assets/site.css)
                check "$origin$href" 200 text/css || failed=$((failed + 1))
                ;;
              *)
                echo "::error::the published page links $href, outside any /assets/ segment"
                failed=$((failed + 1))
                ;;
            esac
          fi

          check "$base/es/" 200 text/html || failed=$((failed + 1))
          check "$base/og-image.png" 200 image/ || failed=$((failed + 1))

          # Checked as text/*, not as a specific media type: the content of both
          # files is produced here, but their MIME type is chosen by the Pages
          # front door, and a rebranded content type is not worth a red deploy.
          check "$base/robots.txt" 200 text/ || failed=$((failed + 1))
          check "$base/sitemap.xml" 200 text/ || failed=$((failed + 1))

          # Last, on purpose. A missing page 404s on a site that is not live at
          # all, so this assertion only carries information once a real page and
          # a real asset have answered 200 from the same mount. When they have
          # not, reporting "ok 404" would print a pass beside a dead deployment.
          if [ "$failed" = 0 ]; then
            check "$base/no-such-page-$GITHUB_RUN_ID.html" 404 || failed=$((failed + 1))
          else
            echo '  skip 404  unknown-path check adds nothing once the checks above failed'
          fi

          rm -f "$body"
          if [ "$failed" = 0 ]; then
            echo "Published site verified at $base"
          else
            echo "::error::$failed check(s) disagreed — the artifact deployed, but Pages is not serving it as expected"
          fi
          exit "$failed"
